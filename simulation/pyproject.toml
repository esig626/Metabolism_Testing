[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabolism-testing-fluxemu"
version = "0.1.0"
description = "Scoped FluxEMU simulation snapshot for observable-MID testing research"
requires-python = ">=3.11"
dependencies = [
  "cobra==0.31.1",
  "numpy>=2.0",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.scripts]
fluxemu = "fluxemu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fluxemu.carbon_transitions" = ["data/*.yaml", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
